version: '3.8'
services:
  app:
    image: frappe/erpnext:v15.40.0
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - BRAND_NAME=NEXUS SUPPLY ERP
      - PRIMARY_COLOR=#4F46E5
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bmad
      - POSTGRES_PASSWORD=bmad_secret
      - POSTGRES_DB=tpl_lerp_warehouse_erp
